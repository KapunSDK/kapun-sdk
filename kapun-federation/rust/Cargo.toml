[package]
name = "kapun-federation-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "kapun_federation_rust"

[dependencies]
uniffi = { features = ["tokio"], workspace = true, optional = true }
openid-federation.workspace = true
serde.workspace = true
serde_json.workspace = true
kapun-util-rust = { path = "../../kapun-util/rust", default-features = false }

[features]
default = ["uniffi"]
uniffi = ["dep:uniffi", "kapun-util-rust/uniffi"]
