[package]
name = "kapun-dcql-sdjwt-rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "kapun_dcql_sdjwt_rust"

[dependencies]
uniffi = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
chrono.workspace = true
rand.workspace = true
kapun-util-rust = { path = "../../kapun-util/rust" }
kapun-credential-core-rust = { path = "../../kapun-credential-core/rust" }
curve25519-dalek = { version = "=4.1.2", features = ["rand_core", "digest"], optional = true }

[dev-dependencies]
p256 = { version = "0.13.2", features = ["jwk", "ecdsa"] }

[features]
default = ["uniffi"]
uniffi = ["dep:uniffi", "kapun-credential-core-rust/uniffi"]
experimental = ["dep:curve25519-dalek"]
sdjwt-extension = ["experimental"]
