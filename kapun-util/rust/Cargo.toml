[package]
name = "kapun-util-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "kapun_util_rust"

[dependencies]
uniffi = { features = ["tokio"], workspace = true, optional = true}
base64.workspace = true
ciborium.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
chrono.workspace = true
openid-federation.workspace = true
flate2 = "1.1.1"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
[target.'cfg(any(target_os = "android"))'.dependencies]
libc.workspace = true
[dev-dependencies]
p256 = { features = ["ecdsa"], workspace = true }

[features]
default = ["uniffi"]
uniffi = ["dep:uniffi"]
