name: Lint

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  ktlint:
    name: Kotlin lint
    runs-on: ["macOS"]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Check Kotlin formatting
        run: ./gradlew ktlintCheck --console=plain
