name: Publish to Maven Central

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Prerelease suffixes may contain hyphens and dots, e.g. v1.0.0-rc.1
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  release:
    # Publishing must only ever happen for version tags, even if this workflow is
    # accidentally dispatched or GitHub reports an invalid workflow on a branch push.
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: ["kmp", "android", "ios", "jvm"]
    name: "Publish to Maven Central"
    runs-on: ["self-hosted", "macOS"]
    timeout-minutes: 120
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.platform }}
      cancel-in-progress: false
    env:
      # Keep Cargo's compilation cache separate from Gradle outputs. Release builds still compile
      # every ABI required by the published artifact.
      # runner.temp is unavailable in a job-level env block. Keep this aligned with
      # the shared target directory configured by the Gradle/UniFFI plugin.
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target
      # Keep Cargo's registry and Git caches private to this matrix job. The self-hosted runner
      # can execute matrix jobs concurrently; sharing $HOME/.cargo makes them wait on Cargo's
      # package-cache lock.
      CARGO_HOME: ${{ github.workspace }}/.cargo
      # Use Git CLI for Git dependencies so Git's non-interactive setting is honored. Cargo's
      # default libgit2 transport does not honor GIT_TERMINAL_PROMPT and can wait for credentials.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      GIT_TERMINAL_PROMPT: "0"
      CARGO_NET_RETRY: "1"
      CARGO_HTTP_TIMEOUT: "30"
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 5G

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ runner.os }}-release-${{ matrix.platform }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            sccache-${{ runner.os }}-release-${{ matrix.platform }}-

      - name: Install sccache
        run: brew list sccache >/dev/null 2>&1 || brew install sccache

      - name: Determine Gradle tasks
        id: gradle_tasks
        run: |
          targets=()
          case "${{ matrix.platform }}" in
            kmp) targets+=("KotlinMultiplatform") ;;
            android) targets+=("Android") ;;
            ios) targets+=("IosArm64" "IosSimulatorArm64") ;;
            jvm) targets+=("Jvm") ;;
          esac

          tasks=""
          for target in "${targets[@]}"; do
            tasks="$tasks publish${target}PublicationToMavenCentralRepository"
          done
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT";

      - name: Set up JDK
        uses: actions/setup-java@v6.0.0
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup rust Tool Chain
        # No toolchain input: the version is taken from rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0

      - name: Install Android SDK components
        if: matrix.platform == 'android' || matrix.platform == 'kmp'
        run: |
          yes | sdkmanager --licenses
          yes | sdkmanager --install "ndk;28.2.13676358"

      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - name: Install Linux-Toolchain
        run: |
          brew tap messense/macos-cross-toolchains
          # install x86_64-unknown-linux-gnu toolchain
          brew install x86_64-unknown-linux-gnu
          # install aarch64-unknown-linux-gnu toolchain
          brew install aarch64-unknown-linux-gnu
          # install mingw-w64 targets
          brew install mingw-w64
      - name: Export iOS deployment target
        run: |
          echo "IPHONEOS_DEPLOYMENT_TARGET=$(grep '^IPHONEOS_DEPLOYMENT_TARGET=' gradle.properties | cut -d '=' -f2)" >> "$GITHUB_ENV"

      - name: Publish artifact
        env:
          CC_x86_64_unknown_linux_gnu: x86_64-linux-gnu-gcc
          CXX_x86_64_unknown_linux_gnu: x86_64-linux-gnu-g++
          AR_x86_64_unknown_linux_gnu: x86_64-linux-gnu-ar
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: x86_64-linux-gnu-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-args=-fstack-protector-all -lssp"
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-args=-fstack-protector-all -lssp"
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY_ARMOR_ASC }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.MAVEN_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSPHRASE }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          ./gradlew buildBindings ${{ steps.gradle_tasks.outputs.tasks }} -PreleaseBuild=true -PgithubRefName=${{ github.ref_name }} -PRELEASE_SIGNING_ENABLED=true
