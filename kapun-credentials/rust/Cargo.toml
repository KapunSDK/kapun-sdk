[package]
name = "kapun-credentials-rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "kapun_credentials_rust"

[dependencies]
anyhow.workspace = true
uniffi = { workspace = true, optional = true }
tokio = { features = ["full"], workspace = true, optional = true }
base64.workspace = true
ciborium = { workspace = true, optional = true }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
chrono.workspace = true
reqwest = { workspace = true, optional = true }
kapun-util-rust = { path = "../../kapun-util/rust" }
kapun-crypto-rust = { path = "../../kapun-crypto/rust", optional = true }
zkp-util = { workspace = true, optional = true }
rdf-util = { workspace = true, optional = true }
next-gen-signatures = { workspace = true, optional = true }
rand_core.workspace = true
ark-serialize = { workspace = true, optional = true }
num-bigint = { version = "0.4.6", optional = true }
json-ld = { version = "0.21.4", features = ["reqwest"], optional = true }
iref = { version = "3.2.2", optional = true }
mime = { version = "0.3.17", optional = true }
json-syntax = { version = "0.12.5", optional = true }
static-iref = { version = "3.0.0", optional = true }
multibase = { workspace = true, optional = true }
png = { version = "0.18.0", optional = true }
curve25519-dalek = { version = "=4.1.2", features = [
    "rand_core",
    "digest",
], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
openssl-sys = { version = "0.9.111", features = ["vendored"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

p256 = { version = "0.13.2", features = ["jwk", "ecdsa"] }

[features]
default = ["bbs", "mdoc", "sdjwt", "w3c", "openbadges", "uniffi"]
bbs = ["dep:next-gen-signatures", "dep:zkp-util", "dep:rdf-util", "dep:ark-serialize", "dep:num-bigint"]
mdoc = ["dep:ciborium"]
sdjwt = ["dep:sha2"]
sdjwt-extension = ["sdjwt", "experimental"]
w3c = ["json-ld", "tokio", "sdjwt"]
openbadges = ["dep:png", "w3c"]
json-ld = ["dep:json-ld", "dep:rdf-util", "dep:multibase", "dep:reqwest", "dep:iref", "dep:mime", "dep:static-iref", "dep:kapun-crypto-rust", "dep:json-syntax"]
tokio = ["dep:tokio", "uniffi/tokio"]
uniffi = ["dep:uniffi"]
experimental = ["dep:curve25519-dalek"]
