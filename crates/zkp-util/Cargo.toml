[package]
name = "zkp-util"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
ark-bls12-381 = { workspace = true }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-secp256r1 = { workspace = true }
ark-serialize = { workspace = true }
ark-std = { workspace = true }
base64 = { workspace = true }
bbs_plus = { workspace = true }
chrono = { workspace = true }
ciborium = { version = "0.2" }
kvac = { version = "0.7.0", default-features = false, features = ["parallel"] }
legogroth16 = { version = "0.16.0" }
multibase = { workspace = true }
num-bigint = { version = "0.4.6" }
proof_system = "0.32.0"
rand_core = { workspace = true }
rdf-proofs = { git = "https://github.com/heidiverse/rdf-proofs", branch = "main" }
rdf-util = { path = "../rdf-util" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ecdsa_pops = { git = "https://github.com/lebedenko-ubique/ecdsa_pops.git", default-features = false }
rok = { git = "https://github.com/lebedenko-ubique/ecdsa_pops.git", default-features = false }

[features]
default = []
asm = ["ecdsa_pops/asm"]
